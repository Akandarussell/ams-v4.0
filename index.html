    <!-- Container Environment WebSocket Error Suppressor for Vite HMR -->
    <script>
      (function() {
        // Suppress unhandled rejection and error events from Vite HMR WebSockets
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (msg.includes('WebSocket') || msg.includes('[vite] failed to connect to websocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Intercept native WebSocket to prevent Vite client from throwing closed without opened
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            // Only intercept local/vite HMR connections; let Supabase or external connections pass through
            if (urlStr.includes('supabase.co')) {
              return new NativeWebSocket(url, protocols);
            }
            if (urlStr.includes('vite') || urlStr.includes('ais-dev') || urlStr.includes('localhost') || urlStr.includes('run.app') || !protocols) {
              var dummy = new EventTarget();
              dummy.readyState = 3; // CLOSED
              dummy.send = function() {};
              dummy.close = function() {};
              dummy.onopen = null;
              dummy.onclose = null;
              dummy.onerror = null;
              dummy.onmessage = null;
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }
      })();
    </script>
